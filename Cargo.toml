[workspace]
resolver = "3"
members = ["crates/*", "dev/dnd-probe"]
default-members = ["crates/*", "dev/dnd-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuxqiu/waystow"

# Same lint set as ../quillway and ../zippel. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
uninlined_format_args = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
assert_is_empty = "allow"

[workspace.dependencies]
waystow-core = { path = "crates/waystow-core" }
waystow-store = { path = "crates/waystow-store" }
waystow-jobs = { path = "crates/waystow-jobs" }
waystow-wl = { path = "crates/waystow-wl" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync", "signal"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
